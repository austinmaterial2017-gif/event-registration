<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>凭证验证 · 微光现场</title>
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <header class="site-header compact">
      <a class="brand" href="index.html">微光<span>现场</span></a>
      <span class="back-link">现场验票</span>
    </header>
    <main class="verification-shell">
      <p id="verification-message" class="notice" role="status" aria-live="polite"></p>
      <section id="verification-result" aria-live="polite"></section>
      <form id="staff-check-in-form" class="staff-check-in form-card" hidden>
        <p class="eyebrow">STAFF ACTION</p>
        <h2>员工确认签到</h2>
        <p class="helper">扫码验证只读取凭证，不会签到。请当面核对后，再执行以下独立操作。</p>
        <label>员工身份<input name="staffIdentity" type="text" autocomplete="off" required></label>
        <label>签到场次
          <select name="sessionId" required>
            <option value="">请选择本次签到场次</option>
          </select>
        </label>
        <label class="staff-confirm">
          <input name="confirmCheckIn" type="checkbox" required>
          我已当面核对参与者与本场讲座
        </label>
        <button class="primary-button" type="submit">确认本场签到</button>
      </form>
    </main>
    <script type="module" src="js/verify-page.js"></script>
  </body>
</html>
