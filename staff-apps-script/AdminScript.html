<script>
  (() => {
    "use strict";

    const state = {
      dashboard: null,
      bundles: null,
      selectedEventId: "",
      selectedDraftId: "",
      draftDocument: null,
      draftNextStep: "",
      search: "",
      dashboardRequestId: 0,
      eventSavePending: false,
      eventSaveNotice: "",
      sessionSaveNotice: false,
      actionNotice: "",
      previewSelectedSeatId: "",
      previewUsesDraftLayout: false
    };
    const statusNode = document.querySelector("#admin-status");

    function setStatus(message, kind = "success") {
      statusNode.textContent = message;
      statusNode.dataset.kind = kind;
      statusNode.style.color = kind === "error" ? "var(--danger)" : "var(--green)";
    }

    function sessionCapacityLabel_(capacity) {
      const value = Number(capacity);
      return Number.isFinite(value) && value > 0 ? `${value} 人` : "不限人数";
    }

    function adminRunner_(success, isCurrent = () => true, onSettled = () => {}) {
      return google.script.run
        .withSuccessHandler((result) => {
          if (!isCurrent()) return;
          onSettled();
          if (!result || result.ok !== true) {
            setStatus(result && result.message ? result.message : "管理员功能不可用。", "error");
            return;
          }
          success(result.data);
        })
        .withFailureHandler(() => {
          if (!isCurrent()) return;
          onSettled();
          setStatus("管理员功能不可用。", "error");
        });
    }

    function setEventSavePending_(pending, activeButton) {
      state.eventSavePending = pending;
      const saveButton = document.querySelector("#save-event");
      if (pending) {
        state.eventSaveButton = activeButton || saveButton;
        state.eventSaveButtonText = state.eventSaveButton.textContent;
        state.eventSaveButton.textContent =
          state.eventSaveButton === saveButton ? "正在保存…" : "处理中…";
      } else if (state.eventSaveButton) {
        state.eventSaveButton.textContent = state.eventSaveButtonText;
        state.eventSaveButton = null;
        state.eventSaveButtonText = "";
      }
      saveButton.disabled = pending;
      document.querySelectorAll("#event-form [data-action]").forEach((button) => {
        button.disabled = pending || !state.selectedEventId;
      });
    }

    function runButtonAction_(button, pendingText, successText, invoke, onSuccess = () => {}) {
      if (button.dataset.pending === "true") return;
      const originalText = button.textContent;
      button.dataset.pending = "true";
      button.disabled = true;
      button.textContent = pendingText;
      const settle = () => {
        delete button.dataset.pending;
        button.disabled = false;
        button.textContent = originalText;
      };
      const runner = adminRunner_((data) => {
        onSuccess(data);
        state.actionNotice = successText;
        setStatus(successText);
      }, undefined, settle);
      invoke(runner);
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined && text !== null) node.textContent = String(text);
      if (className) node.className = className;
      return node;
    }

    function replaceList(selector, items, render) {
      const container = document.querySelector(selector);
      container.replaceChildren();
      if (!items || items.length === 0) {
        container.append(element("p", "暂无记录。", "empty"));
        return;
      }
      items.forEach((item) => container.append(render(item)));
    }

    function dataRow(title, status, details) {
      const row = element("article", null, "data-row");
      row.append(element("span", status || "record", "pill"));
      row.append(element("strong", title || "未命名"));
      (details || []).filter(Boolean).forEach((detail) => row.append(element("small", detail)));
      return row;
    }

    function editButton(label, handler) {
      const button = element("button", label);
      button.type = "button";
      button.className = "secondary";
      button.addEventListener("click", handler);
      return button;
    }

    function safeSheetUrl(value) {
      try {
        const url = new URL(String(value || ""));
        return url.protocol === "https:" && url.hostname === "docs.google.com" &&
          /^\/spreadsheets\/d\/[^/]+\/edit\/?$/.test(url.pathname) ? url.href : "";
      } catch (_ignored) {
        return "";
      }
    }

    function draftStepLabel_(step) {
      return {
        activity: "先填写并保存活动资料",
        sessions: "建立讲座场次",
        seats: "开放或生成座位",
        questions: "建立报名问题",
        confirm: "检查内容并确认生成数据表"
      }[step] || "继续完成设置";
    }

    function updateConditionalEventFields_() {
      const form = document.querySelector("#event-form");
      const needsSessions = !["none", "free"].includes(form.elements.selectionMode.value);
      const needsSeats = form.elements.seatMode.value !== "none";
      document.querySelector("#min-session-field").hidden = !needsSessions;
      document.querySelector("#max-session-field").hidden = !needsSessions;
      document.querySelector("#seat-zone-field").hidden = !needsSeats;
    }

    function syncSelectedEventFields() {
      ["#session-form", "#seat-form", "#question-form"].forEach((selector) => {
        const form = document.querySelector(selector);
        form.elements.eventId.value = state.selectedEventId;
      });
      const hasSelection = Boolean(state.selectedEventId || state.selectedDraftId);
      const hasGeneratedActivity = Boolean(state.selectedEventId);
      document.querySelectorAll(".selected-required").forEach((section) => {
        section.hidden = !hasSelection;
      });
      document.querySelectorAll(".generated-required").forEach((section) => {
        section.hidden = !hasGeneratedActivity;
      });
      document.querySelectorAll("#event-form [data-action]").forEach((button) => {
        button.disabled = !hasGeneratedActivity;
      });
      document.querySelectorAll('nav a[href^="#"]').forEach((link) => {
        const requiresActivity = link.getAttribute("href") !== "#events";
        const requiresGeneratedActivity = ["#records", "#attendance"]
          .includes(link.getAttribute("href"));
        if (requiresActivity) {
          const disabled = !hasSelection || (requiresGeneratedActivity && !hasGeneratedActivity);
          link.setAttribute("aria-disabled", String(disabled));
          if (disabled) link.removeAttribute("aria-current");
        }
      });
      document.querySelector("#activity-empty-state").hidden = hasSelection;
      document.querySelector("#save-event").textContent =
        hasGeneratedActivity ? "保存活动" : "保存草稿";
    }

    function renderActivitySelector(events, drafts) {
      const selector = document.querySelector("#activity-selector");
      selector.replaceChildren();
      const placeholder = element("option", "选择活动", "");
      placeholder.value = "";
      selector.append(placeholder);
      (drafts || []).forEach((item) => {
        const option = element("option", `草稿：${item.draft.event.title || "未命名活动"}`);
        option.value = `draft:${item.draftId}`;
        selector.append(option);
      });
      events.forEach((item) => {
        const option = element("option", item.title || "未命名活动");
        option.value = item.eventId;
        selector.append(option);
      });
      selector.value = state.selectedDraftId
        ? `draft:${state.selectedDraftId}` : state.selectedEventId;
    }

    function renderSelectedActivity(item, isDraft = false) {
      const context = document.querySelector("#selected-activity");
      const title = document.querySelector("#selected-activity-title");
      const meta = document.querySelector("#selected-activity-meta");
      const sheetLink = document.querySelector("#selected-activity-sheet");
      const finalizeButton = document.querySelector("#finalize-draft");
      const deleteDraftButton = document.querySelector("#delete-draft");
      const deleteEventButton = document.querySelector("#delete-empty-event");
      context.hidden = !item;
      if (!item) {
        sheetLink.hidden = true;
        sheetLink.removeAttribute("href");
        finalizeButton.hidden = true;
        deleteDraftButton.hidden = true;
        deleteEventButton.hidden = true;
        return;
      }
      const event = isDraft ? item.draft.event : item;
      title.textContent = isDraft
        ? `正在设置：${event.title || "新活动草稿"}` : `正在设置：${event.title || "未命名活动"}`;
      meta.textContent = isDraft
        ? `尚未生成数据表 · 下一步：${draftStepLabel_(item.nextStep)}`
        : `${event.status || "draft"}${event.location ? ` · ${event.location}` : ""}`;
      finalizeButton.hidden = !isDraft;
      finalizeButton.disabled = isDraft && item.nextStep !== "confirm";
      deleteDraftButton.hidden = !isDraft;
      deleteEventButton.hidden = isDraft || item.canDelete !== true;
      const sheetUrl = safeSheetUrl(item.sheetUrl);
      sheetLink.hidden = isDraft || !sheetUrl;
      if (sheetUrl) sheetLink.href = sheetUrl;
      else sheetLink.removeAttribute("href");
    }

    function resetSessionEditor_() {
      const form = document.querySelector("#session-form");
      form.reset();
      form.elements.eventId.value = state.selectedEventId;
      form.elements.sessionId.value = "";
      if (form.elements.checkInMode) form.elements.checkInMode.value = "single";
      if (form.elements.checkInCount) form.elements.checkInCount.value = "1";
      if (form.elements.checkInLabels) form.elements.checkInLabels.value = "";
      updateConditionalSessionFields_();
      document.querySelector("#session-editor-mode").textContent = "正在新增场次";
      document.querySelector("#save-session").textContent = "保存新场次";
    }

    function updateConditionalSessionFields_() {
      const form = document.querySelector("#session-form");
      if (!form.elements.checkInMode) return;
      const mode = form.elements.checkInMode.value;
      const multiple = mode === "automatic" || mode === "manual";
      const fields = document.querySelector("#session-checkpoint-fields");
      if (fields) fields.hidden = !multiple;
      if (mode === "none") form.elements.checkInCount.value = "0";
      if (mode === "single") form.elements.checkInCount.value = "1";
    }

    function resetRelatedForms() {
      resetSessionEditor_();
      ["#seat-form", "#question-form"].forEach((selector) => {
        document.querySelector(selector).reset();
      });
      syncSelectedEventFields();
    }

    function selectActivity(eventId) {
      const selectedValue = String(eventId || "");
      state.selectedDraftId = selectedValue.startsWith("draft:")
        ? selectedValue.slice(6) : "";
      state.selectedEventId = state.selectedDraftId ? "" : selectedValue;
      state.draftDocument = null;
      if (!state.selectedEventId && !state.selectedDraftId) {
        const eventForm = document.querySelector("#event-form");
        eventForm.reset();
        eventForm.elements.eventId.value = "";
        renderSelectedActivity(null);
      }
      resetRelatedForms();
      loadDashboard();
    }

    function startNewActivity() {
      state.selectedEventId = "";
      state.selectedDraftId = "";
      state.draftDocument = null;
      state.draftNextStep = "";
      state.dashboardRequestId += 1;
      document.querySelector("#event-form").reset();
      document.querySelector("#event-form").elements.eventId.value = "";
      document.querySelector("#event-form").elements.seatHoldMinutes.value = "5";
      document.querySelector("#event-form").elements.registrationTimeLimitMinutes.value = "5";
      document.querySelector("#event-form").elements.totalCapacity.value = "0";
      document.querySelector("#event-form").elements.checkInMode.value = "session";
      resetRelatedForms();
      renderSelectedActivity({
        draftId: "",
        draft: { event: { title: "" } },
        nextStep: "activity"
      }, true);
      document.querySelector("#activity-selector").value = "";
      syncSelectedEventFields();
      setStatus("正在建立新活动草稿（尚未生成数据表）。");
      document.querySelector("#event-form").querySelector("input[name=title]").focus();
    }

    function renderDashboard(data) {
      data = data || {};
      state.dashboard = data;
      state.previewUsesDraftLayout = false;
      const events = Array.isArray(data.events) ? data.events : [];
      const drafts = Array.isArray(data.drafts) ? data.drafts : [];
      if (!events.some((item) => item.eventId === state.selectedEventId)) state.selectedEventId = "";
      if (!drafts.some((item) => item.draftId === state.selectedDraftId)) state.selectedDraftId = "";
      const selectedEvent = events.find((item) => item.eventId === state.selectedEventId) || null;
      const selectedDraft = drafts.find((item) => item.draftId === state.selectedDraftId) || null;
      if (selectedDraft) {
        state.draftDocument = selectedDraft.draft;
        state.draftNextStep = selectedDraft.nextStep;
      }
      renderActivitySelector(events, drafts);
      renderSelectedActivity(selectedDraft || selectedEvent, Boolean(selectedDraft));
      syncSelectedEventFields();
      document.querySelector("#connection-status").textContent = data.connection && data.connection.connected
        ? `已连接：${data.connection.sheetName || "Google Sheet"}`
        : "未连接到数据表。";
      replaceList("#event-list", drafts.concat(events), (item) => {
        const isDraft = Boolean(item.draftId);
        const event = isDraft ? item.draft.event : item;
        const row = dataRow(event.title, isDraft ? "草稿" : event.status, [
          event.location, `${event.selectionMode} · ${event.seatMode}`,
          isDraft ? "尚未生成数据表" : `场次选择 ${event.minChoices}–${event.maxChoices}`
        ]);
        const selected = isDraft
          ? item.draftId === state.selectedDraftId : item.eventId === state.selectedEventId;
        const choose = editButton(selected ? "正在管理" : "管理此活动", () =>
          selectActivity(isDraft ? `draft:${item.draftId}` : item.eventId));
        choose.setAttribute("aria-pressed", selected ? "true" : "false");
        row.append(choose);
        return row;
      });
      const visibleSessions = selectedDraft ? selectedDraft.draft.sessions : data.sessions;
      const visibleQuestions = selectedDraft ? selectedDraft.draft.questions : data.questions;
      replaceList("#session-list", visibleSessions, (item) => {
        const row = dataRow(item.title, item.status, [
          item.speaker, item.location, `${item.startsAt || "未定"} → ${item.endsAt || "未定"}`,
          `容量 ${sessionCapacityLabel_(item.capacity)}${item.required ? " · 必选" : ""}${item.groupRule ? ` · ${item.groupRule}` : ""}`
        ]);
        const actions = element("div", null, "actions");
        actions.append(editButton("编辑场次", () =>
          selectedDraft ? editDraftSession_(item) : editAdminSession(item)));
        const deleteButton = editButton("删除场次", () =>
          selectedDraft
            ? deleteDraftSession_(item, deleteButton)
            : deleteGeneratedSession_(item, deleteButton));
        deleteButton.className = "secondary danger";
        actions.append(deleteButton);
        row.append(actions);
        return row;
      });
      replaceList("#seat-list", selectedDraft ? [] : data.seats, (item) => {
        const row = dataRow(item.label, item.status, [item.zone, item.sessionId]);
        const actions = element("div", null, "actions");
        ["reserve", "close", "reopen"].forEach((action) => {
          const button = element("button", action === "reserve" ? "保留" : action === "close" ? "关闭" : "重新开放");
          button.type = "button";
          button.className = "secondary";
          button.dataset.action = action;
          button.addEventListener("click", () => saveSeatAction(action, item.seatId, button));
          actions.append(button);
        });
        row.append(actions);
        return row;
      });
      replaceList("#question-list", visibleQuestions, (item) => {
        const row = dataRow(item.label, item.status, [
          `${item.type}${item.required ? " · 必填" : ""}`,
          `排序 ${item.sortOrder}${item.showOnTicket ? " · 票面显示" : ""}${item.duplicateIdentity ? " · 身份判断" : ""}`
        ]);
        const actions = element("div", null, "actions");
        actions.append(editButton("编辑问题", () =>
          selectedDraft ? editDraftQuestion_(item) : editAdminQuestion(item)));
        if (selectedDraft) {
          const deleteButton = editButton("删除问题", () =>
            deleteDraftQuestion_(item, deleteButton));
          deleteButton.className = "secondary danger";
          actions.append(deleteButton);
        } else {
          const isActive = String(item.status || "").toLowerCase() === "active";
          const visibilityButton = editButton(
            isActive ? "隐藏问题" : "重新显示",
            () => setQuestionVisibility_(item, visibilityButton, isActive)
          );
          actions.append(visibilityButton);
        }
        row.append(actions);
        return row;
      });
      replaceList("#record-list", data.records, (item) =>
        dataRow(`${item.ticketNumber} · ${item.participantName}`, item.status, [
          item.registrationId, item.email || item.phone,
          `场次 ${item.sessionIds.join(", ") || "无"} · 座位 ${item.seatChoices.join(", ") || "无"}`
        ]));
      replaceList("#attendance-list", data.attendance, (item) =>
        dataRow(item.registrationId, item.status, [
          `场次 ${item.sessionId}`, item.checkedInAt, item.checkedInBy
        ]));
      if (selectedDraft) fillEventEditor(selectedDraft.draft.event);
      else if (selectedEvent) fillEventEditor(selectedEvent);
      updateConditionalEventFields_();
      renderSeatPreview_();
      if ((selectedDraft || selectedEvent) && state.eventSaveNotice) {
        setStatus(state.eventSaveNotice);
        state.eventSaveNotice = "";
        if (selectedDraft && state.draftNextStep) {
          const target = {
            sessions: "#sessions",
            seats: "#seats",
            questions: "#questions",
            confirm: "#selected-activity"
          }[state.draftNextStep] || "#selected-activity";
          scrollToAdminSection_(target);
        } else {
          document.querySelector("#selected-activity").scrollIntoView({
            behavior: window.matchMedia &&
              window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
            block: "center"
          });
        }
      } else if (state.sessionSaveNotice) {
        setStatus(`场次保存成功，目前已有 ${visibleSessions.length} 个场次。`);
        state.sessionSaveNotice = false;
        state.actionNotice = "";
      } else if (state.actionNotice) {
        setStatus(state.actionNotice);
        state.actionNotice = "";
      } else {
        setStatus(selectedDraft
          ? `草稿已读取，下一步请${draftStepLabel_(selectedDraft.nextStep)}。`
          : selectedEvent ? "当前活动数据已更新。" : "请选择一个活动，或先新建活动。");
      }
    }

    function loadDashboard(search = state.search) {
      state.search = search;
      const requestId = ++state.dashboardRequestId;
      const requestedEventId = state.selectedEventId;
      const requestedDraftId = state.selectedDraftId;
      const isCurrent = () => state.dashboardRequestId === requestId &&
        state.selectedEventId === requestedEventId && state.selectedDraftId === requestedDraftId;
      setStatus("正在读取管理数据…");
      const payload = { search };
      if (requestedEventId) payload.eventId = requestedEventId;
      adminRunner_(renderDashboard, isCurrent).getAdminDashboard(payload);
    }

    function formObject(form) {
      return Object.fromEntries(new FormData(form).entries());
    }

    function checked(form, name) {
      return form.elements[name].checked === true;
    }

    function localDateValue(value) {
      return value ? new Date(value).toISOString() : "";
    }

    function localDateInput(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    }

    function focusEditor(form) {
      form.scrollIntoView({ behavior: "smooth", block: "center" });
      const firstVisible = form.querySelector("input:not([type=hidden]), select, textarea");
      if (firstVisible) firstVisible.focus();
    }

    function fillEventEditor(item) {
      const form = document.querySelector("#event-form");
      form.elements.eventId.value = item.eventId || "";
      form.elements.title.value = item.title || "";
      form.elements.description.value = item.description || "";
      form.elements.status.value = item.status || "draft";
      form.elements.opensAt.value = localDateInput(item.opensAt);
      form.elements.closesAt.value = localDateInput(item.closesAt);
      form.elements.location.value = item.location || "";
      form.elements.selectionMode.value = item.selectionMode || "none";
      form.elements.minChoices.value = item.minChoices || 0;
      form.elements.maxChoices.value = item.maxChoices || 0;
      form.elements.seatMode.value = item.seatMode || "none";
      form.elements.seatMapLabel.value = item.seatMapLabel || "舞台 / 白板";
      form.elements.seatZones.value = (item.seatZones || []).join("\n");
      form.elements.showOpeningCountdown.checked = item.showOpeningCountdown === true;
      form.elements.showClosingCountdown.checked = item.showClosingCountdown === true;
      form.elements.cancellationEnabled.checked = item.cancellationEnabled === true;
      form.elements.seatExchangeEnabled.checked = item.seatExchangeEnabled === true;
      form.elements.seatHoldsEnabled.checked = item.seatHoldsEnabled === true;
      form.elements.seatHoldMinutes.value = item.seatHoldMinutes || 5;
      form.elements.registrationTimeLimitMinutes.value =
        item.registrationTimeLimitMinutes ?? 5;
      form.elements.totalCapacity.value = item.totalCapacity ?? 0;
      form.elements.checkInMode.value = item.checkInMode || "session";
      updateConditionalEventFields_();
    }

    function editAdminEvent(item) {
      fillEventEditor(item);
      focusEditor(document.querySelector("#event-form"));
    }

    function editAdminSession(item) {
      const form = document.querySelector("#session-form");
      form.elements.sessionId.value = item.sessionId;
      form.elements.eventId.value = item.eventId;
      form.elements.title.value = item.title;
      form.elements.speaker.value = item.speaker;
      form.elements.startsAt.value = localDateInput(item.startsAt);
      form.elements.endsAt.value = localDateInput(item.endsAt);
      form.elements.location.value = item.location;
      form.elements.capacity.value = item.capacity;
      form.elements.required.checked = item.required === true;
      form.elements.groupRule.value = item.groupRule;
      if (form.elements.checkInMode) form.elements.checkInMode.value = item.checkInMode || "single";
      if (form.elements.checkInCount) form.elements.checkInCount.value = String(item.checkInCount ?? 1);
      if (form.elements.checkInLabels) form.elements.checkInLabels.value = (item.checkInLabels || []).join("\n");
      form.elements.status.value = item.status;
      updateConditionalSessionFields_();
      document.querySelector("#session-editor-mode").textContent =
        `正在编辑：${item.title || "未命名场次"}`;
      document.querySelector("#save-session").textContent = "保存场次修改";
      focusEditor(form);
    }

    function editDraftSession_(item) {
      editAdminSession({
        ...item,
        eventId: "",
        sessionId: item.draftKey || ""
      });
    }

    function editAdminQuestion(item) {
      const form = document.querySelector("#question-form");
      form.elements.questionId.value = item.questionId;
      form.elements.eventId.value = item.eventId;
      form.elements.label.value = item.label;
      form.elements.type.value = item.type;
      form.elements.options.value = (item.options || []).join("\n");
      form.elements.validation.value = JSON.stringify(item.validation || {}, null, 2);
      form.elements.sortOrder.value = item.sortOrder;
      form.elements.status.value = item.status;
      form.elements.required.checked = item.required === true;
      form.elements.showOnTicket.checked = item.showOnTicket === true;
      form.elements.duplicateIdentity.checked = item.duplicateIdentity === true;
      form.elements.semanticRole.value = item.semanticRole || "";
      focusEditor(form);
    }

    function editDraftQuestion_(item) {
      editAdminQuestion({
        ...item,
        eventId: "",
        questionId: item.draftKey || ""
      });
    }

    function eventPayload(action) {
      const form = document.querySelector("#event-form");
      const values = formObject(form);
      const eventId = values.eventId;
      delete values.eventId;
      const payload = {
        ...values,
        action,
        opensAt: localDateValue(values.opensAt),
        closesAt: localDateValue(values.closesAt),
        minChoices: Number(values.minChoices),
        maxChoices: Number(values.maxChoices),
        seatZones: values.seatZones.split(/\r?\n/).map((value) => value.trim()).filter(Boolean),
        showOpeningCountdown: checked(form, "showOpeningCountdown"),
        showClosingCountdown: checked(form, "showClosingCountdown"),
        cancellationEnabled: checked(form, "cancellationEnabled"),
        seatExchangeEnabled: checked(form, "seatExchangeEnabled"),
        seatHoldsEnabled: checked(form, "seatHoldsEnabled"),
        seatHoldMinutes: Number(values.seatHoldMinutes),
        registrationTimeLimitMinutes: Number(values.registrationTimeLimitMinutes),
        totalCapacity: Number(values.totalCapacity),
        checkInMode: values.checkInMode
      };
      if (eventId) payload.eventId = eventId;
      return payload;
    }

    function validateEventPayload_(payload, form) {
      if (typeof form.checkValidity === "function" && !form.checkValidity()) {
        if (typeof form.reportValidity === "function") form.reportValidity();
        return "请检查画面中标示的必填栏位或数字。";
      }
      if (!String(payload.title || "").trim()) return "请填写活动名称。";
      if (payload.opensAt && payload.closesAt &&
          Date.parse(payload.closesAt) <= Date.parse(payload.opensAt)) {
        return "报名截止时间必须晚于报名开放时间。";
      }
      if (!Number.isInteger(payload.minChoices) || payload.minChoices < 0) {
        return "最少场次必须是 0 或正整数。";
      }
      if (!Number.isInteger(payload.maxChoices) || payload.maxChoices < 0) {
        return "最多场次必须是 0 或正整数。";
      }
      if (payload.maxChoices < payload.minChoices) {
        return "最多场次不能少于最少场次。";
      }
      if (!Number.isInteger(payload.seatHoldMinutes) || payload.seatHoldMinutes < 1) {
        return "锁位分钟数必须是 1 或以上的整数。";
      }
      if (!Number.isInteger(payload.registrationTimeLimitMinutes) ||
          payload.registrationTimeLimitMinutes < 0) {
        return "报名操作倒计时必须是 0 或正整数。";
      }
      if (!Number.isInteger(payload.totalCapacity) || payload.totalCapacity < 0) {
        return "活动总容量必须是 0 或正整数。";
      }
      if (!["session", "event", "none"].includes(payload.checkInMode)) {
        return "请选择有效的签到方式。";
      }
      return "";
    }

    function formValidityMessage_(form) {
      if (typeof form.checkValidity === "function" && !form.checkValidity()) {
        if (typeof form.reportValidity === "function") form.reportValidity();
        return "请检查画面中标示的必填栏位或数字。";
      }
      return "";
    }

    function validateSessionValues_(values, form) {
      const nativeMessage = formValidityMessage_(form);
      if (nativeMessage) return nativeMessage;
      if (!String(values.title || "").trim()) return "请填写场次标题。";
      const capacity = Number(values.capacity);
      if (!Number.isInteger(capacity) || capacity < 0) {
        return "场次容量必须是 0 或正整数（0 代表不限人数）。";
      }
      if (Boolean(values.startsAt) !== Boolean(values.endsAt)) {
        return "场次开始和结束时间必须一起填写。";
      }
      if (values.startsAt && values.endsAt &&
          Date.parse(values.endsAt) <= Date.parse(values.startsAt)) {
        return "场次结束时间必须晚于开始时间。";
      }
      if (["automatic", "manual"].includes(values.checkInMode)) {
        const count = Number(values.checkInCount);
        if (!Number.isInteger(count) || count < 1 || count > 20) {
          return "多次签到的次数必须是 1 至 20 的整数。";
        }
        const labels = String(values.checkInLabels || "").split(/\r?\n/);
        if (labels.length > count) return "签到名称的行数不能多于签到次数。";
      }
      return "";
    }

    function validateSeatValues_(values, form) {
      const nativeMessage = formValidityMessage_(form);
      if (nativeMessage) return nativeMessage;
      if (values.mode === "none") return "";
      const rows = Number(values.rows);
      const seatsPerRow = Number(values.seatsPerRow);
      if (!Number.isInteger(rows) || rows < 1) {
        return "座位行数必须是 1 或以上的整数。";
      }
      if (!Number.isInteger(seatsPerRow) || seatsPerRow < 1) {
        return "每行座位数必须是 1 或以上的整数。";
      }
      if (values.mode === "zone" && !String(values.zoneName || "").trim()) {
        return "区域选座模式需要填写区域名称。";
      }
      return "";
    }

    function validateQuestionValues_(values, form, validation, options) {
      const nativeMessage = formValidityMessage_(form);
      if (nativeMessage) return nativeMessage;
      if (!String(values.label || "").trim()) return "请填写问题文字。";
      const semanticRequirements = {
        name: { types: ["text", "textarea"], label: "姓名栏", expected: "text 或 textarea" },
        email: { types: ["email"], label: "电邮栏", expected: "email" },
        phone: { types: ["tel"], label: "电话栏", expected: "tel" }
      };
      const semantic = semanticRequirements[values.semanticRole];
      if (semantic && !semantic.types.includes(values.type)) {
        return `资料用途“${semantic.label}”必须使用 ${semantic.expected} 字段类型。`;
      }
      if (checked(form, "duplicateIdentity") &&
          (values.status !== "active" || !checked(form, "required"))) {
        return "用于重复身份判断的问题必须设为“显示”并勾选“必填”。";
      }
      const sortOrder = Number(values.sortOrder);
      if (!Number.isInteger(sortOrder) || sortOrder < 0) {
        return "问题排序必须是 0 或正整数。";
      }
      if (!validation || typeof validation !== "object" || Array.isArray(validation)) {
        return "高级验证设置必须是 JSON 对象，例如 {}。";
      }
      if (["select", "radio", "checkbox"].includes(values.type) && !options.length) {
        return "这个问题类型需要至少一个选项（每行一个）。";
      }
      return "";
    }

    function syncQuestionCompatibility_() {
      const form = document.querySelector("#question-form");
      const roleTypes = { name: "text", email: "email", phone: "tel" };
      const role = form.elements.semanticRole.value;
      if (roleTypes[role]) form.elements.type.value = roleTypes[role];
      if (form.elements.duplicateIdentity.checked) {
        form.elements.required.checked = true;
        form.elements.status.value = "active";
      }
    }

    function seatPreviewModel_() {
      const eventForm = document.querySelector("#event-form");
      const seatForm = document.querySelector("#seat-form");
      const values = formObject(seatForm);
      const mode = values.mode || "none";
      const stageLabel = String(eventForm.elements.seatMapLabel.value || "").trim() ||
        "舞台 / 白板";
      if (mode === "none") {
        return {
          mode,
          stageLabel,
          message: "参与者会看到自由入座，不需要选择座位。",
          zones: []
        };
      }

      const selectedSessionId = String(values.sessionId || "").trim();
      const savedSeats = state.dashboard && Array.isArray(state.dashboard.seats)
        ? state.dashboard.seats.filter((seat) =>
          seat.eventId === state.selectedEventId &&
          String(seat.sessionId || "") === selectedSessionId)
        : [];
      const zoneMap = new Map();
      if (savedSeats.length && !state.previewUsesDraftLayout) {
        savedSeats.forEach((seat) => {
          const zoneName = String(seat.zone || values.zoneName || "座位区");
          if (!zoneMap.has(zoneName)) zoneMap.set(zoneName, []);
          zoneMap.get(zoneName).push({
            id: seat.seatId,
            label: seat.label,
            state: seat.status === "available" ? "available" : "unavailable"
          });
        });
      } else {
        const rows = Math.min(Math.max(Number(values.rows) || 0, 0), 20);
        const seatsPerRow = Math.min(
          Math.max(Number(values.seatsPerRow) || 0, 0), 20
        );
        const zoneName = String(values.zoneName || "").trim() ||
          (mode === "zone" ? "请填写区域名称" : "座位区");
        const generated = [];
        for (let row = 1; row <= rows; row += 1) {
          for (let seat = 1; seat <= seatsPerRow; seat += 1) {
            generated.push({
              id: `preview-${zoneName}-${row}-${seat}`,
              label: `${zoneName === "座位区" ? "" : `${zoneName}-`}${row}-${seat}`,
              state: "available"
            });
          }
        }
        if (generated.length) zoneMap.set(zoneName, generated);
      }
      const columns = Math.min(Math.max(Number(values.seatsPerRow) || 6, 1), 20);
      const zones = Array.from(zoneMap, ([name, seats]) => ({
        name,
        columns,
        seats: seats.map((seat) => ({
          ...seat,
          state: seat.state === "available" &&
            seat.id === state.previewSelectedSeatId ? "selected" : seat.state
        }))
      }));
      return {
        mode,
        stageLabel,
        message: zones.length
          ? (mode === "auto"
            ? "这是座位排列预览；参与者提交后由系统自动分配。"
            : "点击可选座位可模拟参与者暂选；这不会占用真实座位。")
          : "请填写有效的行数和每行座位数，预览会立即出现。",
        zones
      };
    }

    function renderSeatPreview_() {
      const model = seatPreviewModel_();
      const stage = document.querySelector("#seat-preview-stage");
      const message = document.querySelector("#seat-preview-message");
      const floor = document.querySelector("#seat-preview-floor");
      if (!stage || !message || !floor) return;
      stage.textContent = model.stageLabel;
      message.textContent = model.message;
      floor.replaceChildren();
      model.zones.forEach((zoneModel) => {
        const zone = element("section", null, "seat-preview-zone");
        zone.append(element("strong", zoneModel.name, "seat-preview-zone-name"));
        const grid = element("div", null, "seat-preview-grid");
        grid.style.setProperty("--seat-columns", zoneModel.columns);
        zoneModel.seats.forEach((seat) => {
          const button = element("button", seat.label, "seat-preview-button");
          button.type = "button";
          button.setAttribute("aria-label", `${seat.label} · ${
            seat.state === "available" ? "可选择" :
              seat.state === "selected" ? "暂选中" : "已被选择"
          }`);
          if (seat.state === "selected") button.classList.add("is-selected");
          if (seat.state === "unavailable") {
            button.classList.add("is-unavailable");
            button.disabled = true;
          } else {
            button.addEventListener("click", () => {
              state.previewSelectedSeatId =
                state.previewSelectedSeatId === seat.id ? "" : seat.id;
              renderSeatPreview_();
            });
          }
          grid.append(button);
        });
        zone.append(grid);
        floor.append(zone);
      });
    }

    function bindEditedFeedback_(form, message) {
      ["input", "change"].forEach((eventName) => {
        form.addEventListener(eventName, () => {
          if (statusNode.dataset.kind === "error" && !state.eventSavePending) {
            setStatus(message);
          }
        });
      });
    }

    function saveEvent(action, activeButton) {
      if (state.eventSavePending) return;
      const form = document.querySelector("#event-form");
      const payload = eventPayload(action);
      const validationMessage = validateEventPayload_(payload, form);
      if (validationMessage) {
        setStatus(validationMessage, "error");
        return;
      }
      if (action && !payload.eventId) {
        setStatus("请先选择一个活动，或先保存新活动。", "error");
        return;
      }
      const isNewActivity = !payload.eventId;
      if (isNewActivity && !action) {
        delete payload.action;
        payload.status = "draft";
        const draftDocument = state.draftDocument || {
          event: payload,
          sessions: [],
          seatPlan: { mode: payload.seatMode || "none", sessionId: "", zones: [] },
          questions: []
        };
        draftDocument.event = payload;
        setEventSavePending_(true, activeButton);
        setStatus("正在保存活动草稿…");
        const request = { ...draftDocument };
        if (state.selectedDraftId) request.draftId = state.selectedDraftId;
        adminRunner_((savedDraft) => {
          state.selectedDraftId = savedDraft.draftId;
          state.selectedEventId = "";
          state.draftDocument = savedDraft.draft;
          state.draftNextStep = savedDraft.nextStep;
          state.eventSaveNotice =
            `草稿保存成功，下一步请${draftStepLabel_(savedDraft.nextStep)}。`;
          loadDashboard();
        }, undefined, () => setEventSavePending_(false)).saveAdminDraft(request);
        return;
      }
      if (action === "reopen") {
        const count = state.dashboard && state.dashboard.records
          ? new Set(state.dashboard.records.filter((record) => record.eventId === payload.eventId)
            .map((record) => record.registrationId)).size : 0;
        if (!window.confirm(`此活动已有 ${count} 个报名。确认重新开放？`)) return;
        payload.confirm = true;
      }
      setEventSavePending_(true, activeButton);
      setStatus("正在保存活动…");
      adminRunner_((savedEvent) => {
        if (isNewActivity && savedEvent && savedEvent.eventId) state.selectedEventId = savedEvent.eventId;
        state.eventSaveNotice = isNewActivity
          ? "活动建立成功，已显示刚建立的活动。"
          : "活动保存成功，已显示最新内容。";
        loadDashboard();
      }, undefined, () => setEventSavePending_(false)).saveAdminEvent(payload);
    }

    document.querySelector("#event-form").addEventListener("submit", (event) => {
      event.preventDefault();
      saveEvent("", document.querySelector("#save-event"));
    });
    bindEditedFeedback_(
      document.querySelector("#event-form"),
      "内容已修改，请按“保存活动”确认。"
    );
    document.querySelector("#event-form").addEventListener("input", renderSeatPreview_);
    document.querySelectorAll("#event-form [data-action]").forEach((button) => {
      button.addEventListener("click", () => saveEvent(button.dataset.action, button));
    });
    document.querySelector("#activity-selector").addEventListener("change", (event) => {
      selectActivity(event.currentTarget.value);
    });
    document.querySelector("#new-activity").addEventListener("click", startNewActivity);
    document.querySelector("#event-form").elements.selectionMode
      .addEventListener("change", updateConditionalEventFields_);
    document.querySelector("#event-form").elements.seatMode
      .addEventListener("change", updateConditionalEventFields_);

    function persistDraftDocument_(
      documentValue, button, pendingText, successText, onSaved = () => {}
    ) {
      const request = { ...documentValue, draftId: state.selectedDraftId };
      runButtonAction_(
        button,
        pendingText,
        successText,
        (runner) => runner.saveAdminDraft(request),
        (savedDraft) => {
          state.selectedDraftId = savedDraft.draftId;
          state.draftDocument = savedDraft.draft;
          state.draftNextStep = savedDraft.nextStep;
          state.eventSaveNotice =
            `${successText} 下一步请${draftStepLabel_(savedDraft.nextStep)}。`;
          onSaved(savedDraft);
          loadDashboard();
        }
      );
    }

    document.querySelector("#session-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const values = formObject(form);
      const validationMessage = validateSessionValues_(values, form);
      if (validationMessage) {
        setStatus(validationMessage, "error");
        return;
      }
      const payload = {
        ...values,
        sessionId: values.sessionId || undefined,
        startsAt: localDateValue(values.startsAt),
        endsAt: localDateValue(values.endsAt),
        capacity: Number(values.capacity),
        required: checked(form, "required"),
        checkInMode: values.checkInMode || "single",
        checkInCount: (values.checkInMode || "single") === "none" ? 0 :
          ((values.checkInMode || "single") === "single" ? 1 : Number(values.checkInCount)),
        checkInLabels: (values.checkInMode || "single") === "none" ? [] :
          ((values.checkInMode || "single") === "single" ? [""] :
            String(values.checkInLabels || "").split(/\r?\n/).map((label) => label.trim()))
      };
      if (state.selectedDraftId) {
        const draftKey = values.sessionId ||
          `draft-session-${state.draftDocument.sessions.length + 1}`;
        delete payload.eventId;
        delete payload.sessionId;
        payload.draftKey = draftKey;
        const sessions = state.draftDocument.sessions.slice();
        const existingIndex = sessions.findIndex((item) => item.draftKey === draftKey);
        if (existingIndex === -1) sessions.push(payload);
        else sessions[existingIndex] = payload;
        persistDraftDocument_(
          { ...state.draftDocument, sessions },
          document.querySelector("#save-session"),
          "正在保存场次草稿…",
          "场次草稿保存成功。",
          (savedDraft) => {
            resetSessionEditor_();
            state.eventSaveNotice =
              `场次保存成功，目前已有 ${savedDraft.draft.sessions.length} 个场次。`;
          }
        );
        return;
      }
      runButtonAction_(
        document.querySelector("#save-session"),
        "正在保存场次…",
        "场次保存成功。",
        (runner) => runner.saveAdminSession(payload),
        () => {
          resetSessionEditor_();
          state.sessionSaveNotice = true;
          loadDashboard();
        }
      );
    });
    document.querySelector("#new-session").addEventListener("click", () => {
      resetSessionEditor_();
      focusEditor(document.querySelector("#session-form"));
    });
    const sessionCheckInMode = document.querySelector("#session-form").elements.checkInMode;
    if (sessionCheckInMode) sessionCheckInMode
      .addEventListener("change", updateConditionalSessionFields_);

    document.querySelector("#seat-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const values = formObject(form);
      const validationMessage = validateSeatValues_(values, form);
      if (validationMessage) {
        setStatus(validationMessage, "error");
        return;
      }
      const mode = values.mode;
      const payload = {
        eventId: values.eventId,
        sessionId: values.sessionId,
        action: "generate",
        mode,
        zones: mode === "none" ? [] : [{
          name: values.zoneName,
          rows: Number(values.rows),
          seatsPerRow: Number(values.seatsPerRow)
        }]
      };
      if (state.selectedDraftId) {
        persistDraftDocument_(
          {
            ...state.draftDocument,
            seatPlan: {
              mode,
              sessionId: values.sessionId || "",
              zones: payload.zones
            }
          },
          document.querySelector("#save-seat-plan"),
          "正在保存座位草稿…",
          "座位方案草稿保存成功。"
        );
        return;
      }
      runButtonAction_(
        document.querySelector("#save-seat-plan"),
        "正在保存座位…",
        "座位方案保存成功。",
        (runner) => runner.saveAdminSeatPlan(payload),
        () => loadDashboard()
      );
    });
    ["input", "change"].forEach((eventName) => {
      document.querySelector("#seat-form").addEventListener(eventName, () => {
        state.previewSelectedSeatId = "";
        state.previewUsesDraftLayout = true;
        renderSeatPreview_();
      });
    });

    const expandSeatPreviewButton = document.querySelector("#expand-seat-preview");
    if (expandSeatPreviewButton) expandSeatPreviewButton.addEventListener("click", (event) => {
      const preview = document.querySelector("#seat-preview");
      const expanded = !preview.classList.contains("is-expanded");
      preview.classList.toggle("is-expanded", expanded);
      document.body.classList.toggle("has-seat-preview-modal", expanded);
      event.currentTarget.setAttribute("aria-expanded", String(expanded));
      event.currentTarget.textContent = expanded ? "关闭放大预览" : "放大预览";
    });
    if (typeof document.addEventListener === "function") document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      const preview = document.querySelector("#seat-preview");
      if (!preview.classList.contains("is-expanded")) return;
      preview.classList.remove("is-expanded");
      document.body.classList.remove("has-seat-preview-modal");
      const button = document.querySelector("#expand-seat-preview");
      button.setAttribute("aria-expanded", "false");
      button.textContent = "放大预览";
      button.focus();
    });

    function saveSeatAction(action, seatId, button) {
      if (!state.selectedEventId) {
        setStatus("请先选择一个活动，再更新座位。", "error");
        return;
      }
      const payload = { eventId: state.selectedEventId, action, seatId };
      runButtonAction_(
        button,
        "处理中…",
        "座位状态更新成功。",
        (runner) => runner.saveAdminSeatPlan(payload),
        () => loadDashboard()
      );
    }

    function deleteDraftQuestion_(item, button) {
      if (!state.selectedDraftId || button.dataset.pending === "true") return;
      if (!window.confirm(`确认删除问题“${item.label || "未命名问题"}”？删除后无法恢复。`)) {
        return;
      }
      const questions = state.draftDocument.questions.filter((question) =>
        question.draftKey !== item.draftKey);
      persistDraftDocument_(
        { ...state.draftDocument, questions },
        button,
        "正在删除问题…",
        "问题已删除。"
      );
    }

    function deleteDraftSession_(item, button) {
      if (!state.selectedDraftId || button.dataset.pending === "true") return;
      if (!window.confirm(
        `确认删除场次“${item.title || "未命名场次"}”？删除后无法恢复。`
      )) return;
      const sessions = state.draftDocument.sessions.filter((session) =>
        session.draftKey !== item.draftKey);
      const seatPlan = { ...state.draftDocument.seatPlan };
      if (seatPlan.sessionId === item.draftKey) seatPlan.sessionId = "";
      persistDraftDocument_(
        { ...state.draftDocument, sessions, seatPlan },
        button,
        "正在删除场次…",
        "场次已删除。"
      );
    }

    function deleteGeneratedSession_(item, button) {
      if (!state.selectedEventId || button.dataset.pending === "true") return;
      if (!window.confirm(
        `确认永久删除场次“${item.title || "未命名场次"}”？只有完全没有报名、座位或签到记录的场次才能删除。`
      )) return;
      runButtonAction_(
        button,
        "正在删除场次…",
        "场次已删除。",
        (runner) => runner.deleteAdminSession({
          eventId: state.selectedEventId,
          sessionId: item.sessionId,
          confirm: true
        }),
        () => {
          if (document.querySelector("#session-form").elements.sessionId.value ===
              item.sessionId) resetSessionEditor_();
          loadDashboard();
        }
      );
    }

    function setQuestionVisibility_(item, button, isActive) {
      if (!state.selectedEventId || button.dataset.pending === "true") return;
      const action = isActive ? "hide" : "show";
      if (isActive && !window.confirm(
        `确认隐藏问题“${item.label || "未命名问题"}”？参与者将不再看到它，旧报名记录会保留。`
      )) return;
      const payload = {
        eventId: state.selectedEventId,
        questionId: item.questionId,
        action
      };
      if (isActive) {
        payload.duplicateIdentity = false;
        payload.showOnTicket = false;
      }
      runButtonAction_(
        button,
        isActive ? "正在隐藏…" : "正在重新显示…",
        isActive ? "问题已隐藏，旧报名记录仍保留。" : "问题已重新显示。",
        (runner) => runner.saveAdminQuestion(payload),
        () => loadDashboard()
      );
    }

    document.querySelector("#question-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const values = formObject(form);
      let validation;
      try {
        validation = JSON.parse(values.validation || "{}");
      } catch (_ignored) {
        setStatus("验证规则必须是有效 JSON。", "error");
        return;
      }
      const options = values.options.split(/\r?\n/)
        .map((value) => value.trim()).filter(Boolean);
      const validationMessage = validateQuestionValues_(
        values, form, validation, options
      );
      if (validationMessage) {
        setStatus(validationMessage, "error");
        return;
      }
      const payload = {
        ...values,
        questionId: values.questionId || undefined,
        options,
        validation,
        sortOrder: Number(values.sortOrder),
        required: checked(form, "required"),
        showOnTicket: checked(form, "showOnTicket"),
        duplicateIdentity: checked(form, "duplicateIdentity"),
        semanticRole: values.semanticRole
      };
      if (state.selectedDraftId) {
        const draftKey = values.questionId ||
          `draft-question-${state.draftDocument.questions.length + 1}`;
        delete payload.eventId;
        delete payload.questionId;
        payload.draftKey = draftKey;
        const questions = state.draftDocument.questions.slice();
        const existingIndex = questions.findIndex((item) => item.draftKey === draftKey);
        if (existingIndex === -1) questions.push(payload);
        else questions[existingIndex] = payload;
        persistDraftDocument_(
          { ...state.draftDocument, questions },
          document.querySelector("#save-question"),
          "正在保存问题草稿…",
          "问题草稿保存成功。"
        );
        return;
      }
      runButtonAction_(
        document.querySelector("#save-question"),
        "正在保存问题…",
        "问题保存成功。",
        (runner) => runner.saveAdminQuestion(payload),
        () => loadDashboard()
      );
    });
    document.querySelector("#question-form").elements.semanticRole
      .addEventListener("change", syncQuestionCompatibility_);
    document.querySelector("#question-form").elements.duplicateIdentity
      .addEventListener("change", syncQuestionCompatibility_);

    document.querySelector("#finalize-draft").addEventListener("click", (event) => {
      if (!state.selectedDraftId || state.draftNextStep !== "confirm") {
        setStatus("请先完成系统提示的活动设置。", "error");
        return;
      }
      if (!window.confirm(
        "确认建立这个活动的数据表？建立后仍是草稿，不会自动开放报名。"
      )) return;
      runButtonAction_(
        event.currentTarget,
        "正在生成数据表…",
        "数据表建立成功，活动仍是草稿。",
        (runner) => runner.finalizeAdminDraft({
          draftId: state.selectedDraftId,
          confirm: true
        }),
        (created) => {
          state.selectedEventId = created.eventId;
          state.selectedDraftId = "";
          state.draftDocument = null;
          state.draftNextStep = "";
          state.eventSaveNotice = "数据表建立成功；请检查后再开放报名。";
          loadDashboard();
        }
      );
    });

    document.querySelector("#delete-draft").addEventListener("click", (event) => {
      if (!state.selectedDraftId) return;
      if (!window.confirm("确认删除这个未生成数据表的活动草稿？")) return;
      runButtonAction_(
        event.currentTarget,
        "正在删除草稿…",
        "草稿已删除。",
        (runner) => runner.deleteAdminDraft({
          draftId: state.selectedDraftId,
          confirm: true
        }),
        () => {
          state.selectedDraftId = "";
          state.draftDocument = null;
          state.draftNextStep = "";
          loadDashboard();
        }
      );
    });

    document.querySelector("#delete-empty-event").addEventListener("click", (event) => {
      if (!state.selectedEventId) return;
      if (!window.confirm(
        "确认删除这个没有报名、票券或签到记录的活动？数据表会移到 Google Drive 回收站。"
      )) return;
      runButtonAction_(
        event.currentTarget,
        "正在删除空活动…",
        "空活动已移到回收站。",
        (runner) => runner.deleteEmptyAdminEvent({
          eventId: state.selectedEventId,
          confirm: true
        }),
        () => {
          state.selectedEventId = "";
          loadDashboard();
        }
      );
    });

    document.querySelector("#record-search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      loadDashboard(event.currentTarget.elements.search.value.trim());
    });
    document.querySelector("#clear-search").addEventListener("click", () => {
      document.querySelector("#record-search-form").reset();
      loadDashboard();
    });
    document.querySelectorAll("#record-action-form [data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        if (!state.selectedEventId) {
          setStatus("请先选择一个活动，再更新报名记录。", "error");
          return;
        }
        const form = document.querySelector("#record-action-form");
        const values = formObject(form);
        if (!String(values.registrationId || "").trim()) {
          setStatus("请填写要处理的报名 ID。", "error");
          return;
        }
        if (button.dataset.action === "adjust_seat" &&
            !String(values.seatId || "").trim()) {
          setStatus("调整座位时，请填写新的座位 ID。", "error");
          return;
        }
        if (!window.confirm("确认执行此操作并保留完整历史记录？")) return;
        const payload = {
          eventId: state.selectedEventId,
          action: button.dataset.action,
          registrationId: values.registrationId,
          seatId: values.seatId,
          confirm: true
        };
        runButtonAction_(
          button,
          "处理中…",
          "报名记录更新成功。",
          (runner) => runner.adminRecordAction(payload),
          () => loadDashboard()
        );
      });
    });

    bindEditedFeedback_(
      document.querySelector("#session-form"),
      "场次内容已修改，请按保存确认。"
    );
    bindEditedFeedback_(
      document.querySelector("#seat-form"),
      "座位设置已修改，请按生成／更新确认。"
    );
    bindEditedFeedback_(
      document.querySelector("#question-form"),
      "问题内容已修改，请按保存确认。"
    );
    bindEditedFeedback_(
      document.querySelector("#record-action-form"),
      "报名处理资料已修改，请再次确认操作。"
    );

    document.querySelector("#test-sheet").addEventListener("click", () => {
      const spreadsheetId = document.querySelector("#sheet-form").elements.spreadsheetId.value.trim();
      setStatus("正在测试数据表连接…");
      adminRunner_((data) => {
        document.querySelector("#connection-status").textContent = `测试成功：${data.sheetName}`;
        setStatus("目标数据表连接正常。");
      }).testAdminSheetConnection({ spreadsheetId });
    });
    document.querySelector("#switch-sheet").addEventListener("click", () => {
      const spreadsheetId = document.querySelector("#sheet-form").elements.spreadsheetId.value.trim();
      if (!window.confirm("确认切换？旧数据会保留，系统不会自动迁移。")) return;
      setStatus("正在由统一后端验证并切换数据表…");
      adminRunner_((completed) => {
        setStatus(completed.warning);
        document.querySelector("#sheet-form").reset();
        loadDashboard();
      }).switchAdminSheet({ spreadsheetId, confirm: true });
    });

    function loadBundles(onReady) {
      if (state.bundles) {
        onReady(state.bundles);
        return;
      }
      setStatus("正在准备部署源码…");
      adminRunner_((bundles) => {
        state.bundles = bundles;
        onReady(bundles);
      }).getAdminSourceBundles({});
    }

    document.querySelectorAll("[data-copy-bundle]").forEach((button) => {
      button.addEventListener("click", () => {
        loadBundles((bundles) => {
          const key = button.dataset.copyBundle;
          const source = bundles && typeof bundles[key] === "string" ? bundles[key] : "";
          if (!source) {
            setStatus("源码包不可用。", "error");
            return;
          }
          navigator.clipboard.writeText(source)
            .then(() => setStatus("源码已复制；请按文件分隔标记建立独立 Apps Script 项目。"))
            .catch(() => setStatus("无法写入剪贴板，请检查浏览器权限。", "error"));
        });
      });
    });

    function scrollToAdminSection_(targetId) {
      const target = document.querySelector(targetId);
      if (!target) return;
      if (target.hidden) {
        setStatus("请先选择一个活动，再管理该部分。", "error");
        document.querySelector("#activity-selector").focus();
        return;
      }
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        target.scrollIntoView({ behavior: "auto", block: "start" });
      } else {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      document.querySelectorAll('nav a[href^="#"]').forEach((link) => {
        if (link.getAttribute("href") === targetId) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
    }

    document.querySelectorAll('nav a[href^="#"]').forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        scrollToAdminSection_(link.getAttribute("href"));
      });
    });

    loadDashboard();
  })();
</script>
