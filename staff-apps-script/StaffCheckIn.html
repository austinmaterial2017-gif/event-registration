<!doctype html>
<html lang="zh-CN">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>&#x5DE5;&#x4F5C;&#x4EBA;&#x5458;&#x626B;&#x7801;&#x7B7E;&#x5230;</title>
  <style>
    :root { color-scheme:dark; --bg:#121018; --card:#261d2b; --line:#634d6d; --ink:#fff5dc; --muted:#d1bfd2; --accent:#f449a0; --purple:#8b52f5; --ok:#77e4aa; --bad:#ff9aa9; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,"Noto Sans SC","Microsoft YaHei",sans-serif}
    main{width:min(100%,680px);margin:auto;padding:max(24px,env(safe-area-inset-top)) 18px 38px}
    h1{margin:0;font-size:clamp(29px,9vw,48px);line-height:1.06}.lead{color:var(--muted);margin:12px 0 27px}
    .card{padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 18px 55px #0004}
    label{display:grid;gap:7px;margin:16px 0 0;font-weight:800}select,.launch{width:100%;min-height:56px;border-radius:14px;font:inherit}
    select{padding:10px 12px;border:1px solid #745f7d;background:#17131a;color:var(--ink)}.launch{display:grid;place-items:center;margin-top:22px;border:0;color:white;font-weight:900;text-decoration:none;background:linear-gradient(100deg,var(--accent),var(--purple))}
    .launch.disabled,select:disabled{opacity:.52;cursor:not-allowed}.status{min-height:3em;margin:18px 2px 0;color:var(--ok)}.status.error{color:var(--bad)}.step{color:#ffb0d3;font:800 12px/1 Consolas,monospace;letter-spacing:.13em}
  </style>
</head>
<body>
  <main>
    <p class="step">STAFF CHECK-IN</p>
    <h1>&#x5DE5;&#x4F5C;&#x4EBA;&#x5458;&#x626B;&#x7801;&#x7B7E;&#x5230;</h1>
    <p class="lead">&#x5148;&#x9009;&#x597D;&#x6D3B;&#x52A8;&#x3001;&#x8BB2;&#x5EA7;&#x548C;&#x7B7E;&#x5230;&#x6B21;&#x6570;&#xFF0C;&#x7136;&#x540E;&#x8FDE;&#x7EED;&#x626B;&#x6BCF;&#x4E00;&#x4F4D;&#x53C2;&#x4E0E;&#x8005;&#x7684;&#x7535;&#x5B50;&#x7968;&#x3002;</p>
    <section class="card" aria-label="&#x7B7E;&#x5230;&#x8BBE;&#x7F6E;">
      <label>&#x6D3B;&#x52A8;<select id="event" disabled><option>&#x6B63;&#x5728;&#x8BFB;&#x53D6;&#x6D3B;&#x52A8;&#x2026;</option></select></label>
      <label>&#x8BB2;&#x5EA7; / &#x8001;&#x5E08;<select id="session" disabled><option>&#x8BF7;&#x5148;&#x9009;&#x6D3B;&#x52A8;</option></select></label>
      <label id="checkpoint-wrap" hidden>&#x7B7E;&#x5230;&#x6B21;&#x6570;<select id="checkpoint"><option value="">&#x8BF7;&#x9009;&#x62E9;&#x7B7E;&#x5230;&#x6B21;&#x6570;</option></select></label>
      <a id="start" class="launch disabled" aria-disabled="true" target="_top">&#x5F00;&#x59CB;&#x8FDE;&#x7EED;&#x626B;&#x7801;</a>
      <p id="status" class="status" role="status">&#x6B63;&#x5728;&#x8BFB;&#x53D6;&#x7B7E;&#x5230;&#x6D3B;&#x52A8;&#xFF08;&#x7EA6; 15 &#x79D2;&#xFF09;&#x2026;</p>
    </section>
  </main>
  <script>
    // Apps Script can re-evaluate an HtmlService panel while its outer shell is
    // restoring.  Keep all bindings private so a second evaluation never
    // stops the activity list at "正在读取活动…" with a redeclaration error.
    (function () {
    const eventSelect = document.querySelector("#event");
    const sessionSelect = document.querySelector("#session");
    const checkpointSelect = document.querySelector("#checkpoint");
    const checkpointWrap = document.querySelector("#checkpoint-wrap");
    const startLink = document.querySelector("#start");
    const status = document.querySelector("#status");
    let targets = [];
    let preparedScannerUrl = "";
    let preparedKey = "";
    let preparingKey = "";
    const text = {
      chooseEvent: "\u8bf7\u9009\u62e9\u6d3b\u52a8", chooseSession: "\u8bf7\u9009\u62e9\u8bb2\u5ea7 / \u8001\u5e08",
      chooseCount: "\u8bf7\u9009\u62e9\u7b7e\u5230\u6b21\u6570", chooseToday: "\u8bf7\u9009\u62e9\u4eca\u5929\u8981\u7b7e\u5230\u7684\u6d3b\u52a8\u3002",
      chooseBoth: "\u8bf7\u9009\u62e9\u4eca\u5929\u8981\u7b7e\u5230\u7684\u6d3b\u52a8\u548c\u8bb2\u5ea7\u3002", preparing: "\u6b63\u5728\u51c6\u5907\u624b\u673a\u626b\u7801\u2026",
      ready: "\u5df2\u51c6\u5907\u597d\u3002\u8bf7\u6309\u300c\u5f00\u59cb\u8fde\u7eed\u626b\u7801\u300d\u6253\u5f00\u76f8\u673a\u3002",
      openFail: "\u65e0\u6cd5\u51c6\u5907\u626b\u7801\uff0c\u8bf7\u68c0\u67e5\u7f51\u7edc\u540e\u91cd\u8bd5\u3002",
      targetFail: "\u65e0\u6cd5\u8bfb\u53d6\u7b7e\u5230\u6d3b\u52a8\uff0c\u8bf7\u5237\u65b0\u540e\u91cd\u8bd5\u3002", unnamed: "\u672a\u547d\u540d\u6d3b\u52a8"
    };
    function say(message, bad) { status.textContent = message; status.classList.toggle("error", Boolean(bad)); }
    function option(select, value, label) { const node = document.createElement("option"); node.value = value; node.textContent = label; select.append(node); }
    function selectedEvent() { return targets.find((item) => item.eventId === eventSelect.value); }
    function selectedSession() { const event = selectedEvent(); return event && event.sessions.find((item) => item.sessionId === sessionSelect.value); }
    function selectionKey_() {
      const session = selectedSession();
      if (!session || (session.checkInMode === "manual" && !checkpointSelect.value)) return "";
      return [eventSelect.value, session.sessionId, checkpointSelect.value || ""].join("|");
    }
    function setScannerLink_(url) {
      preparedScannerUrl = url || "";
      startLink.classList.toggle("disabled", !url);
      startLink.setAttribute("aria-disabled", String(!url));
      if (url) startLink.href = url;
      else startLink.removeAttribute("href");
    }
    function prepareScanner_() {
      const session = selectedSession();
      const key = selectionKey_();
      setScannerLink_("");
      if (!key || !session) return;
      if (preparingKey === key) return;
      preparingKey = key;
      say(text.preparing);
      google.script.run.withSuccessHandler((result) => {
        if (selectionKey_() !== key) return;
        preparingKey = "";
        const pass = result && result.ok && result.data && result.data.scannerPass;
        if (!pass) { say((result && result.message) || text.openFail, true); return; }
        preparedKey = key;
        setScannerLink_(scannerUrl_() + "?scannerPass=" + encodeURIComponent(pass));
        say(text.ready);
      }).withFailureHandler(() => {
        if (selectionKey_() !== key) return;
        preparingKey = "";
        say(text.openFail, true);
      }).createStaffScannerPass({ eventId:eventSelect.value, sessionId:session.sessionId, checkpointId:checkpointSelect.value || undefined });
    }
    function refreshStart() {
      const key = selectionKey_();
      if (key && key === preparedKey && preparedScannerUrl) setScannerLink_(preparedScannerUrl);
      else setScannerLink_("");
    }
    function showCheckpoints() {
      checkpointSelect.length = 0; option(checkpointSelect, "", text.chooseCount);
      const session = selectedSession(); const manual = session && session.checkInMode === "manual";
      const availableCheckpoints = manual
        ? (session.checkpoints || []).filter((item) =>
          item && String(item.checkpointId || "").trim() && item.status !== "completed")
        : [];
      // Older activities can have manual check-in enabled but no checkpoint rows.
      // Keep that legacy data usable as one ordinary check-in instead of trapping
      // staff at an empty selector.
      const legacyCheckpoint = manual && !availableCheckpoints.length
        ? { checkpointId: "checkpoint-1", label: "\u7b2c 1 \u6b21\u7b7e\u5230" }
        : null;
      (legacyCheckpoint ? [legacyCheckpoint] : availableCheckpoints)
        .forEach((item) => option(checkpointSelect, item.checkpointId, item.label));
      if (legacyCheckpoint) checkpointSelect.value = legacyCheckpoint.checkpointId;
      checkpointWrap.hidden = !manual; refreshStart();
      if (session) prepareScanner_();
      else say(text.chooseBoth);
    }
    function showSessions() {
      sessionSelect.length = 0; option(sessionSelect, "", text.chooseSession);
      const event = selectedEvent();
      (event ? event.sessions : []).forEach((item) => option(sessionSelect, item.sessionId, item.title + (item.speaker ? " \u00b7 " + item.speaker : "")));
      sessionSelect.disabled = !event; showCheckpoints();
    }
    eventSelect.addEventListener("change", showSessions);
    sessionSelect.addEventListener("change", showCheckpoints);
    checkpointSelect.addEventListener("change", () => { refreshStart(); prepareScanner_(); });
    function scannerUrl_() { return "https://austinmaterial2017-gif.github.io/event-registration/staff-scanner.html"; }
    startLink.addEventListener("click", (event) => {
      if (!startLink.href || startLink.getAttribute("aria-disabled") === "true") event.preventDefault();
    });
    google.script.run.withSuccessHandler((result) => {
      if (!result || result.ok !== true || !Array.isArray(result.data)) { say(text.targetFail, true); return; }
      targets = result.data; eventSelect.length = 0; option(eventSelect, "", text.chooseEvent);
      targets.forEach((item) => option(eventSelect, item.eventId, item.title || text.unnamed));
      eventSelect.disabled = false; say(text.chooseToday);
    }).withFailureHandler(() => say(text.targetFail, true)).getStaffCheckInTargets();
    }());
  </script>
</body>
</html>
