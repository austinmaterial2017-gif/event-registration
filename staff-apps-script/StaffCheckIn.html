<!doctype html>
<html lang="zh-CN">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="initial-scan" content="<?= initialScan ?>">
    <meta name="staff-return-url" content="<?= staffReturnUrl ?>">
    <meta name="fixed-event-id" content="<?= fixedEventId ?>">
    <meta name="fixed-session-id" content="<?= fixedSessionId ?>">
    <meta name="fixed-checkpoint-id" content="<?= fixedCheckpointId ?>">
    <style>
      body { margin:0; padding:24px; background:#18131d; color:#f8f0df; font:15px/1.5 Arial,sans-serif; }
      main { max-width:560px; margin:auto; } form, section { display:grid; gap:14px; padding:20px; border:1px solid #594463; border-radius:18px; background:#2b202f; }
      label { display:grid; gap:6px; } input, select, button { min-height:44px; padding:9px 11px; border-radius:10px; font:inherit; }
      input, select { border:1px solid #6b5874; background:#171219; color:#fff; } button { border:0; background:linear-gradient(110deg,#ff4fa3,#8755ff); color:#fff; font-weight:800; cursor:pointer; }
      .confirm { display:flex; align-items:flex-start; gap:8px; }.confirm input { min-height:auto; margin-top:5px; }.message { min-height:1.5em; color:#77e4aa; }
      .camera-actions { display:grid; gap:8px; }.camera-help { margin:0; color:#d8c7df; font-size:13px; }
      #camera-scanner { display:grid; gap:10px; } #camera-preview { width:100%; max-height:54vh; border-radius:14px; background:#080609; object-fit:cover; }
      #stop-camera-scan, #scan-next-ticket { background:#4a3b51; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>工作人员验票／参与者签到</h1>
      <p>仅限工作人员使用。扫描参与者的电子票后，再选择场次并确认到场；工作人员身份来自当前 Google 登录账号。</p>
      <p class="camera-help">第一次在手机打开后，可用浏览器菜单选择“加入手机主画面”。以后点桌面图标，再按“打开手机相机扫码”即可，不需要复制网址。</p>
      <form id="fixed-checkin-form">
        <strong>现场快速签到</strong>
        <label>活动
          <select name="eventId" required><option value="">正在读取活动…</option></select>
        </label>
        <label>讲座／老师
          <select name="sessionId" required disabled><option value="">请先选择活动</option></select>
        </label>
        <label id="fixed-checkpoint-field" hidden>签到次数
          <select name="checkpointId"><option value="">请选择签到次数</option></select>
        </label>
        <p id="fixed-checkin-status" class="camera-help">请选择今天要签到的活动和讲座。</p>
      </form>
      <form id="lookup-form">
        <div class="camera-actions">
          <button id="start-camera-scan" type="button">打开手机相机扫码</button>
          <a id="standalone-scanner-link" class="secondary" href="#">iPhone 请使用独立手机扫码页</a>
          <p class="camera-help">也可以把二维码网址粘贴到下方，作为相机无法使用时的备用方式。</p>
        </div>
        <div id="camera-scanner" hidden>
          <video id="camera-preview" playsinline muted aria-label="二维码扫描画面"></video>
          <button id="stop-camera-scan" type="button">停止扫码</button>
        </div>
        <label>二维码 token 或验票网址
          <input name="token" inputmode="url" autocomplete="off" required>
        </label>
        <button type="submit">读取凭证</button>
      </form>
      <form id="check-in-form" hidden>
        <p id="ticket-summary"></p>
        <label id="session-checkin-field">签到场次
          <select name="sessionId" required>
            <option value="">请选择场次</option>
          </select>
        </label>
        <label id="checkpoint-checkin-field" hidden>签到次数
          <select name="checkpointId"><option value="">请选择签到次数</option></select>
        </label>
        <div id="checkpoint-status" aria-live="polite"></div>
        <label class="confirm">
          <input name="confirmCheckIn" type="checkbox" required>
          <span id="confirm-checkin-copy">我已当面核对参与者和本场讲座</span>
        </label>
        <button type="submit">确认本场签到</button>
      </form>
      <button id="scan-next-ticket" type="button" hidden>继续扫描下一位</button>
      <p id="message" class="message" role="status"></p>
    </main>
    <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
    <script>
      const lookupForm = document.querySelector("#lookup-form");
      const fixedCheckInForm = document.querySelector("#fixed-checkin-form");
      const checkInForm = document.querySelector("#check-in-form");
      const message = document.querySelector("#message");
      const summary = document.querySelector("#ticket-summary");
      const sessionField = document.querySelector("#session-checkin-field");
      const confirmCopy = document.querySelector("#confirm-checkin-copy");
      const checkpointField = document.querySelector("#checkpoint-checkin-field");
      const checkpointStatus = document.querySelector("#checkpoint-status");
      const lookupButton = lookupForm.querySelector('button[type="submit"]');
      const checkInButton = checkInForm.querySelector('button[type="submit"]');
      const startCameraButton = document.querySelector("#start-camera-scan");
      const stopCameraButton = document.querySelector("#stop-camera-scan");
      const cameraScanner = document.querySelector("#camera-scanner");
      const cameraPreview = document.querySelector("#camera-preview");
      const standaloneScannerLink = document.querySelector("#standalone-scanner-link");
      const scanNextButton = document.querySelector("#scan-next-ticket");
      const fixedCheckpointField = document.querySelector("#fixed-checkpoint-field");
      const fixedCheckInStatus = document.querySelector("#fixed-checkin-status");
      let checkInTargets = [];
      let fixedCheckInReady = false;
      const initialParameters = new URLSearchParams(window.location.search);
      let pendingReturnedScan = document.querySelector('meta[name="initial-scan"]')?.content ||
        initialParameters.get("t") || initialParameters.get("token") || initialParameters.get("scan") || "";
      let activeToken = "";
      let lookupPending = false;
      let checkInPending = false;
      let activeCheckInMode = "session";
      let activeTicket = null;
      let cameraStream = null;
      let cameraDetector = null;
      let cameraReader = null;
      let cameraScanFrame = 0;

      function standaloneScannerUrl_() {
        const configuredUrl = document.querySelector('meta[name="staff-return-url"]')?.content || "";
        const returnUrl = new URL(configuredUrl);
        if (fixedCheckInReady) {
          returnUrl.searchParams.set("fixedEventId", fixedCheckInForm.elements.eventId.value);
          returnUrl.searchParams.set("fixedSessionId", fixedCheckInForm.elements.sessionId.value);
          if (fixedCheckInForm.elements.checkpointId.value) {
            returnUrl.searchParams.set("fixedCheckpointId", fixedCheckInForm.elements.checkpointId.value);
          }
        }
        return "https://austinmaterial2017-gif.github.io/event-registration/staff-scanner.html?returnUrl=" +
          encodeURIComponent(returnUrl.href);
      }

      function selectedFixedEvent_() {
        if (!fixedCheckInForm) return null;
        return checkInTargets.find((event) => event.eventId === fixedCheckInForm.elements.eventId.value) || null;
      }

      function selectedFixedSession_() {
        const event = selectedFixedEvent_();
        return event && event.sessions.find((session) => session.sessionId === fixedCheckInForm.elements.sessionId.value) || null;
      }

      function populateFixedSessions_() {
        const select = fixedCheckInForm.elements.sessionId;
        const event = selectedFixedEvent_();
        select.length = 1;
        (event ? event.sessions : []).forEach((session) => {
          const option = document.createElement("option");
          option.value = session.sessionId;
          option.textContent = `${session.title || "讲座"}${session.speaker ? " · " + session.speaker : ""}`;
          select.append(option);
        });
        select.disabled = !event;
        renderFixedCheckpoint_();
      }

      function renderFixedCheckpoint_() {
        const session = selectedFixedSession_();
        const select = fixedCheckInForm.elements.checkpointId;
        select.length = 1;
        const checkpoints = session && Array.isArray(session.checkpoints) ? session.checkpoints : [];
        checkpoints.forEach((checkpoint) => {
          const option = document.createElement("option");
          option.value = checkpoint.checkpointId;
          option.textContent = checkpoint.label;
          select.append(option);
        });
        const manual = session && session.checkInMode === "manual";
        fixedCheckpointField.hidden = !manual;
        select.required = Boolean(manual);
        fixedCheckInReady = Boolean(session) && (!manual || Boolean(select.value));
        fixedCheckInStatus.textContent = fixedCheckInReady
          ? `已固定：${selectedFixedEvent_().title} · ${session.title}${session.speaker ? " · " + session.speaker : ""}。现在可连续扫码自动签到。`
          : "请选择今天要签到的活动和讲座。";
        if (standaloneScannerLink) standaloneScannerLink.href = standaloneScannerUrl_();
      }

      function loadFixedCheckInTargets_() {
        if (!fixedCheckInForm) return;
        google.script.run
          .withSuccessHandler((result) => {
            if (!result || result.ok !== true || !Array.isArray(result.data)) {
              fixedCheckInStatus.textContent = "无法读取签到活动，请刷新后重试。";
              return;
            }
            checkInTargets = result.data;
            const eventSelect = fixedCheckInForm.elements.eventId;
            eventSelect.length = 1;
            checkInTargets.forEach((event) => {
              const option = document.createElement("option");
              option.value = event.eventId;
              option.textContent = event.title || "未命名活动";
              eventSelect.append(option);
            });
            const parameters = new URLSearchParams(window.location.search);
            const returnedEventId = document.querySelector('meta[name="fixed-event-id"]')?.content ||
              parameters.get("fixedEventId") || "";
            const returnedSessionId = document.querySelector('meta[name="fixed-session-id"]')?.content ||
              parameters.get("fixedSessionId") || "";
            const returnedCheckpointId = document.querySelector('meta[name="fixed-checkpoint-id"]')?.content ||
              parameters.get("fixedCheckpointId") || "";
            eventSelect.value = returnedEventId;
            populateFixedSessions_();
            fixedCheckInForm.elements.sessionId.value = returnedSessionId;
            renderFixedCheckpoint_();
            fixedCheckInForm.elements.checkpointId.value = returnedCheckpointId;
            renderFixedCheckpoint_();
            if (pendingReturnedScan) {
              const scan = pendingReturnedScan;
              pendingReturnedScan = "";
              if (!submitFixedScan_(scan)) lookupTicketForCheckIn(scan);
            }
          })
          .withFailureHandler(() => { fixedCheckInStatus.textContent = "无法读取签到活动，请刷新后重试。"; })
          .getStaffCheckInTargets();
      }

      function submitFixedScan_(value) {
        const token = parseScannedTicketToken(value);
        if (!token || !fixedCheckInReady || checkInPending) return false;
        checkInPending = true;
        message.textContent = "正在自动签到…";
        google.script.run
          .withSuccessHandler((result) => {
            checkInPending = false;
            if (!result || result.ok !== true) {
              message.textContent = result && result.message ? result.message : "签到未完成，请扫下一张票。";
              return;
            }
            message.textContent = `签到成功：${result.data && result.data.participantName ? result.data.participantName : "参与者"}。请继续扫描下一张票。`;
            startCameraScan_();
          })
          .withFailureHandler(() => { checkInPending = false; message.textContent = "签到未完成，请扫下一张票。"; })
          .checkIn({
            token: token,
            sessionId: fixedCheckInForm.elements.sessionId.value,
            checkpointId: fixedCheckInForm.elements.checkpointId.value || undefined
          });
        return true;
      }

      function selectedSession_() {
        const sessionId = checkInForm.elements.sessionId.value;
        return activeTicket && activeTicket.sessions.find((session) => session.sessionId === sessionId);
      }

      function renderCheckpointControls_() {
        const session = selectedSession_();
        const checkpointSelect = checkInForm.elements.checkpointId;
        if (!checkpointSelect || !checkpointField || !checkpointStatus) return;
        checkpointSelect.length = 1;
        checkpointStatus.textContent = "";
        if (!session || activeCheckInMode !== "session") {
          checkpointField.hidden = true;
          checkpointSelect.required = false;
          return;
        }
        const checkpoints = Array.isArray(session.checkpoints) ? session.checkpoints : [];
        checkpointStatus.textContent = checkpoints.map((checkpoint) =>
          `${checkpoint.status === "completed" ? "✓" : "○"} ${checkpoint.label}`
        ).join(" · ");
        const manual = session.checkInMode === "manual";
        checkpointField.hidden = !manual;
        checkpointSelect.required = manual;
        if (manual) checkpoints.filter((checkpoint) => checkpoint.status !== "completed")
          .forEach((checkpoint) => {
            const option = document.createElement("option");
            option.value = checkpoint.checkpointId;
            option.textContent = checkpoint.label;
            checkpointSelect.append(option);
          });
        checkInButton.textContent = session.checkInMode === "automatic"
          ? "签到下一次" : checkInIdleText();
      }

      function checkInIdleText() {
        return activeCheckInMode === "event" ? "确认整个活动签到" : "确认本场签到";
      }

      function setPending(button, pending, pendingText, idleText) {
        if (!button) return;
        button.disabled = pending;
        button.textContent = pending ? pendingText : idleText;
      }

      function resetForNextTicket_() {
        stopCameraScan_();
        activeToken = "";
        activeTicket = null;
        lookupForm.elements.token.value = "";
        checkInForm.hidden = true;
        checkInForm.elements.sessionId.value = "";
        checkInForm.elements.confirmCheckIn.checked = false;
        if (scanNextButton) scanNextButton.hidden = true;
        message.textContent = "请扫描下一位参与者的二维码。";
        startCameraScan_();
      }

      function parseScannedTicketToken(value) {
        const text = String(value || "").trim();
        if (!text || text.length > 2048) return "";
        try {
          const parsed = new URL(text, window.location.href);
          const queryToken = parsed.searchParams.get("t") || parsed.searchParams.get("token");
          if (queryToken && queryToken.trim().length <= 512) return queryToken.trim();
        } catch (_ignored) {
          // A camera/scanner may provide the opaque token directly.
        }
        return text.length <= 512 && !/\s/.test(text) ? text : "";
      }

      function stopCameraScan_() {
        if (cameraScanFrame && typeof cancelAnimationFrame === "function") {
          cancelAnimationFrame(cameraScanFrame);
        }
        cameraScanFrame = 0;
        if (cameraReader && typeof cameraReader.reset === "function") cameraReader.reset();
        cameraReader = null;
        if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
        cameraDetector = null;
        if (cameraPreview) cameraPreview.srcObject = null;
        if (cameraScanner) cameraScanner.hidden = true;
      }

      async function detectQrFrame_() {
        if (!cameraStream || !cameraDetector || !cameraPreview) return;
        try {
          const barcodes = await cameraDetector.detect(cameraPreview);
          const scannedValue = barcodes && barcodes[0] && barcodes[0].rawValue;
          if (scannedValue) {
            stopCameraScan_();
            message.textContent = "已扫描二维码，正在读取凭证…";
            if (!submitFixedScan_(scannedValue)) lookupTicketForCheckIn(scannedValue);
            return;
          }
        } catch (_ignored) {
          // A frame may be unreadable while the camera is focusing; continue scanning.
        }
        if (cameraStream && typeof requestAnimationFrame === "function") {
          cameraScanFrame = requestAnimationFrame(detectQrFrame_);
        }
      }

      async function startCameraScan_() {
        if (!startCameraButton || cameraStream || cameraReader) return;
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent || "")) {
          // Apps Script is displayed in an iframe. iPhone blocks camera prompts
          // from that frame, so leave it entirely and open the HTTPS scanner at
          // the top level where Safari can ask for camera permission.
          window.top.location.assign(standaloneScannerUrl_());
          return;
        }
        const supportsNativeScanner = typeof BarcodeDetector === "function";
        const supportsZxingScanner = Boolean(
          window.ZXingBrowser && typeof window.ZXingBrowser.BrowserQRCodeReader === "function"
        );
        if ((!supportsNativeScanner && !supportsZxingScanner) || !navigator.mediaDevices ||
            typeof navigator.mediaDevices.getUserMedia !== "function") {
          message.textContent = "网页扫码组件尚未准备好；请检查网络后重试，或暂时把二维码网址粘贴到下方。";
          return;
        }
        setPending(startCameraButton, true, "正在打开相机…", "打开手机相机扫码");
        message.textContent = "正在请求相机权限…";
        try {
          if (!supportsNativeScanner) {
            cameraReader = new window.ZXingBrowser.BrowserQRCodeReader();
            cameraScanner.hidden = false;
            await cameraReader.decodeFromVideoDevice(undefined, cameraPreview, (result) => {
              if (!result) return;
              const scannedValue = typeof result.getText === "function"
                ? result.getText() : result.text;
              if (!scannedValue) return;
              stopCameraScan_();
              message.textContent = "已扫描二维码，正在读取凭证…";
              if (!submitFixedScan_(scannedValue)) lookupTicketForCheckIn(scannedValue);
            });
            message.textContent = "相机已打开，请把参与者二维码放入画面。";
            return;
          }
          cameraDetector = new BarcodeDetector({ formats: ["qr_code"] });
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
          cameraPreview.srcObject = cameraStream;
          cameraScanner.hidden = false;
          await cameraPreview.play();
          message.textContent = "相机已打开，请把参与者二维码放入画面。";
          if (typeof requestAnimationFrame === "function") {
            cameraScanFrame = requestAnimationFrame(detectQrFrame_);
          }
        } catch (_ignored) {
          stopCameraScan_();
          message.textContent = "无法打开相机；请允许相机权限，或把二维码网址粘贴到下方。";
        } finally {
          setPending(startCameraButton, false, "正在打开相机…", "打开手机相机扫码");
        }
      }

      function showResult(result) {
        if (!result || result.ok !== true) {
          message.textContent = result && result.message ? result.message : "员工签到不可用。";
          return;
        }
        const ticket = result.data;
        activeTicket = ticket;
        activeCheckInMode = ["session", "event", "none"].includes(ticket.checkInMode)
          ? ticket.checkInMode : "session";
        summary.textContent = `${ticket.participantName} · ${ticket.event.title} · ${ticket.status}`;
        const select = checkInForm.elements.sessionId;
        select.length = 1;
        ticket.sessions.forEach((session) => {
          const option = document.createElement("option");
          option.value = session.sessionId;
          option.textContent = `${session.title} · ${session.speaker || "讲师待公布"}`;
          select.append(option);
        });
        const sessionMode = activeCheckInMode === "session";
        sessionField.hidden = !sessionMode;
        select.required = sessionMode;
        checkInForm.elements.confirmCheckIn.checked = false;
        confirmCopy.textContent = sessionMode
          ? "我已当面核对参与者和本场讲座"
          : "我已当面核对参与者和整个活动";
        checkInButton.textContent = checkInIdleText();
        renderCheckpointControls_();
        checkInForm.hidden = ticket.status !== "active" || activeCheckInMode === "none";
        message.textContent = activeCheckInMode === "none"
          ? "此活动不需要签到；二维码仍可用于验票。"
          : activeCheckInMode === "event"
            ? "已读取凭证；此活动只需要签到一次。"
            : "已读取凭证；请选择本次签到场次。";
      }

      function lookupTicketForCheckIn(value) {
        if (lookupPending) return;
        activeToken = parseScannedTicketToken(value);
        if (!activeToken) {
          message.textContent = "二维码或验票网址无效。";
          return;
        }
        lookupForm.elements.token.value = activeToken;
        message.textContent = "正在读取凭证…";
        lookupPending = true;
        setPending(lookupButton, true, "正在读取…", "读取凭证");
        google.script.run
          .withSuccessHandler((result) => {
            lookupPending = false;
            setPending(lookupButton, false, "正在读取…", "读取凭证");
            showResult(result);
          })
          .withFailureHandler(() => {
            lookupPending = false;
            setPending(lookupButton, false, "正在读取…", "读取凭证");
            message.textContent = "员工签到不可用。";
          })
          .getStaffTicketForCheckIn({ token: activeToken });
      }

      lookupForm.addEventListener("submit", (event) => {
        event.preventDefault();
        lookupTicketForCheckIn(lookupForm.elements.token.value);
      });
      if (fixedCheckInForm) {
        fixedCheckInForm.elements.eventId.addEventListener("change", populateFixedSessions_);
        fixedCheckInForm.elements.sessionId.addEventListener("change", renderFixedCheckpoint_);
        fixedCheckInForm.elements.checkpointId.addEventListener("change", renderFixedCheckpoint_);
        loadFixedCheckInTargets_();
      }
      if (startCameraButton) startCameraButton.addEventListener("click", startCameraScan_);
      if (standaloneScannerLink) standaloneScannerLink.href = standaloneScannerUrl_();
      if (stopCameraButton) stopCameraButton.addEventListener("click", () => {
        stopCameraScan_();
        message.textContent = "已停止扫码；可以重新打开相机或粘贴二维码网址。";
      });
      if (scanNextButton) scanNextButton.addEventListener("click", resetForNextTicket_);
      if (typeof checkInForm.elements.sessionId.addEventListener === "function") {
        checkInForm.elements.sessionId.addEventListener("change", renderCheckpointControls_);
      }

      checkInForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (checkInPending || !checkInForm.elements.confirmCheckIn.checked) return;
        message.textContent = "正在提交签到…";
        checkInPending = true;
        setPending(checkInButton, true, "正在签到…", checkInIdleText());
        google.script.run
          .withSuccessHandler((result) => {
            checkInPending = false;
            setPending(checkInButton, false, "正在签到…", checkInIdleText());
            if (result && result.ok && activeCheckInMode === "session") {
              const session = selectedSession_();
              if (session && Array.isArray(result.data.checkpoints)) {
                session.checkpoints = result.data.checkpoints;
                renderCheckpointControls_();
              }
            }
            message.textContent = result && result.ok
              ? activeCheckInMode === "event" ? "整个活动签到成功。" : "本场签到成功。"
              : result && result.message ? result.message : "签到未完成。";
            if (scanNextButton) scanNextButton.hidden = !(result && result.ok);
          })
          .withFailureHandler(() => {
            checkInPending = false;
            setPending(checkInButton, false, "正在签到…", checkInIdleText());
            message.textContent = "员工签到不可用。";
          })
          .checkIn({
            token: activeToken,
            sessionId: activeCheckInMode === "session"
              ? checkInForm.elements.sessionId.value : "",
            checkpointId: activeCheckInMode === "session" &&
              selectedSession_() && selectedSession_().checkInMode === "manual"
              ? checkInForm.elements.checkpointId.value : undefined
          });
      });

      if (pendingReturnedScan && !fixedCheckInForm) lookupTicketForCheckIn(pendingReturnedScan);
    </script>
  </body>
</html>
