  <style>
    :root{color-scheme:dark;font-family:Arial,"Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111018;color:#fff5dc}main{max-width:700px;margin:auto;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(34px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}.tag{margin:0;color:#ff70b6;font-size:.72rem;font-weight:800;letter-spacing:.18em}h1{margin:8px 0;font-size:clamp(1.8rem,8vw,3rem)}.intro{margin:0;color:#d9cadc;line-height:1.7}.card{margin-top:22px;padding:18px;border:1px solid #604d68;border-radius:22px;background:#241a2a;box-shadow:0 20px 50px #0005}label{display:grid;gap:8px;margin-top:15px;font-weight:800}input,select,button{min-height:54px;border-radius:14px;font:inherit}input,select{width:100%;padding:11px;border:1px solid #7d6789;background:#120f15;color:#fff5dc}button{width:100%;margin-top:20px;border:0;padding:12px 16px;background:linear-gradient(100deg,#f4499d,#8750f5);color:#fff;font-weight:900;font-size:1rem}button:disabled{opacity:.45}#status{min-height:1.5em;margin:18px 2px 0;color:#8ff3bb;line-height:1.5}#status.error{color:#ff9b9b}#camera-wrap{position:relative;min-height:52vh;margin-top:22px;overflow:hidden;border:1px solid #604d68;border-radius:22px;background:#050407}video{width:100%;min-height:52vh;display:block;object-fit:cover}#result{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:#08070cdb;opacity:0;pointer-events:none;transition:opacity .14s}#result.visible{opacity:1}#result strong{max-width:100%;padding:24px;border:2px solid #ffd278;border-radius:18px;text-align:center;font-size:clamp(1.5rem,7vw,2.3rem);line-height:1.25}#result.success strong{background:#145738;border-color:#6df2af}#result.error strong{background:#6b1830;border-color:#ffabab}@media (prefers-reduced-motion:reduce){#result{transition:none}}
  </style>
